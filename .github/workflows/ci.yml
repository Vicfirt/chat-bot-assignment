name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pipx install ruff==0.16.6
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    env:
      LLM_MODE: dummy
      HF_HOME: ${{ github.workspace }}/.hf-cache
      SENTENCE_TRANSFORMERS_HOME: ${{ github.workspace }}/.hf-cache
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      # Cache the sentence-transformers / cross-encoder weights the retriever
      # tests load (~130 MB) so only the first run pays the download.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.hf-cache
          key: hf-${{ hashFiles('requirements.lock') }}

      - run: pip install -r requirements.lock

      - run: python -m pytest -q
