services:
  ollama:
    image: ollama/ollama:0.3.14
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: pull the configured model into the ollama volume, then exit.
  # Skips the download in dummy mode, and never fails the stack — if the pull
  # can't complete the API falls back to the dummy LLM (LLM_FALLBACK_DUMMY).
  model-pull:
    image: ollama/ollama:0.3.14
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - >
        if [ "${LLM_MODE:-ollama}" = "dummy" ]; then
          echo "LLM_MODE=dummy - skipping model pull";
        else
          ollama pull "${LLM_MODEL:-llama3.2:3b}" ||
          echo "model pull failed - API will fall back to the dummy LLM";
        fi
    restart: "no"

  api:
    build:
      context: .
    image: agentic-rag-tax-chatbot:latest
    environment:
      LLM_MODE: ${LLM_MODE:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
      OLLAMA_BASE_URL: http://ollama:11434
      CHROMA_DIR: /app/data/chroma
      RAW_PDF_DIR: /app/data/raw_pdfs
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_started
      model-pull:
        condition: service_completed_successfully

  ui:
    build:
      context: .
    image: agentic-rag-tax-chatbot:latest
    command: streamlit run app/ui/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    environment:
      API_URL: http://api:8000
      LLM_MODE: ${LLM_MODE:-ollama}
      LLM_MODEL: ${LLM_MODEL:-llama3.2:3b}
    ports:
      - "8501:8501"
    depends_on:
      - api

  ingest:
    build:
      context: .
    image: agentic-rag-tax-chatbot:latest
    profiles: ["ingest"]
    command: python -m app.ingest.build_index
    environment:
      CHROMA_DIR: /app/data/chroma
      RAW_PDF_DIR: /app/data/raw_pdfs
    volumes:
      - ./data:/app/data

  pushgateway:
    image: prom/pushgateway:v1.9.0
    profiles: ["observability"]
    ports:
      - "9091:9091"

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - pushgateway

  loki:
    image: grafana/loki:3.1.1
    profiles: ["observability"]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:3.1.1
    profiles: ["observability"]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki

volumes:
  ollama_models:
  prometheus_data:
  grafana_data:
  loki_data:
