server:
  http_listen_port: 9080
  log_level: warn

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      # The app logs JSON lines; pull a few low-cardinality fields up to labels
      # and keep everything else (request_id, question, queries, ...) queryable
      # at read time with `| json`.
      - json:
          expressions:
            level: level
            stage: stage
            logger: logger
      - labels:
          level:
          stage:
